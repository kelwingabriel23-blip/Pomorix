name: Gerar APK do Pomorix

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm install

      - run: npx cap add android

      - run: python3 scripts/patch_android.py
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - run: npx cap sync android

      - name: Keystore fixa
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Pomorix.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pomorix-APK
          path: Pomorix.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Pomorix 1.0.${{ github.run_number }}
          body: "APK do Pomorix. Baixe o Pomorix.apk e instale no Android."
          files: Pomorix.apk
