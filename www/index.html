<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07040f">
<title>Pomorix</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset=".35" stop-color="#4f7bff"/>
      <stop offset=".7" stop-color="#8b5cf6"/><stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14e0c8"/><stop offset=".5" stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="gBars" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="gLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".35"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
<div class="bg"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
<div id="app">
  <main id="view"></main>
  <nav id="tabbar" aria-label="Navegação"></nav>
</div>
<div id="sheet-root"></div>
<script src="js/app.js"></script>
</body>
</html>
