name: Gerar APK do Pomorix

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android (Capacitor)
        run: npx cap add android

      - name: Aplicar ícone, splash, tema e permissões
        run: python3 scripts/patch_android.py
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Sincronizar web -> Android
        run: npx cap sync android

      - name: Usar keystore fixa (permite atualizar o app sem desinstalar)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Pomorix.apk

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Pomorix-APK
          path: Pomorix.apk

      - name: Publicar em Releases (link direto p/ baixar no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Pomorix 1.0.${{ github.run_number }}
          body: "APK do Pomorix. Baixe o arquivo Pomorix.apk e instale no Android."
          files: Pomorix.apk
